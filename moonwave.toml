title = "RoundKit"
gitRepoUrl = "https://github.com/German-rod/RoundKit"
gitSourceBranch = "main"

[home]
enabled = true
tagline = "A modular, round-flow framework for Roblox."

[docusaurus]
onBrokenLinks = "throw"
onBrokenMarkdownLinks = "warn"
organizationName = "German-rod"
projectName = "RoundKit"
url = "https://German-rod.github.io"
baseUrl = "/RoundKit/"

[[classOrder]]
section = "Core"
classes = ["RoundManager", "Context"]

[[classOrder]]
section = "Win Conditions"
classes = ["WinCondition"]

[[classOrder]]
section = "Reconnection"
classes = ["ReconnectionPolicy"]

[[classOrder]]
section = "Player State"
classes = ["PlayerRoundState", "PlayerStateRegistry", "GlobalMetricRegistry"]

[[classOrder]]
section = "Dependencies"
collapsed = true
classes = ["Signal"]